[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hidagent"
version = "0.1.0"
description = "Give Meta Muse a body on an idle iPad through ESP32 BLE HID and AirPlay"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pillow>=10", "PyJWT[crypto]>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
android = ["uiautomator2>=3.7"]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
iphone-agent = "hidagent.cli:main"

[project.urls]
Homepage = "https://github.com/onehumanbeing/esp32-iphone-agent"

[tool.setuptools]
packages = ["hidagent", "hidagent.hermes_memory"]

[tool.setuptools.package-data]
hidagent = ["static/*", "static/companion/*", "static/companion/assets/*", "hermes_memory/LICENSE", "hermes_memory/UPSTREAM.md", "x_photo_templates/*.png"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E701"]  # one-line `case` arms keep the action dispatch compact

[tool.pytest.ini_options]
testpaths = ["tests"]
