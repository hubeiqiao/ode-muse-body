name: Offline verification
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e './server[dev,mcp]'
      - run: npm ci --prefix tools/twitter-text-validator
      - run: PYTHONPATH=. python -m pytest -q -p no:cacheprovider
        working-directory: server
      - run: node --test server/tests/*.test.mjs server/tests/*.test.cjs
      - run: npm ci --prefix companion-ui && npm run build --prefix companion-ui
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli core install esp32:esp32@3.3.8 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli lib install 'NimBLE-Arduino@2.3.9'
      - run: cp devices/ipad/firmware/hid_bridge_ble_c3/secrets.example.h devices/ipad/firmware/hid_bridge_ble_c3/secrets.h
      - run: arduino-cli compile --fqbn 'esp32:esp32:esp32c3:CDCOnBoot=cdc' devices/ipad/firmware/hid_bridge_ble_c3
