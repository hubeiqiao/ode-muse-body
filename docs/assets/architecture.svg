<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Give Muse a body: Ode architecture</title><desc id="desc">Gemini Live voice feeds Muse Spark planner and actor. Jev judges each proposed step. Approved steps go to ESP32 Bluetooth keyboard and mouse, which operates iPad mini. AirPlay sends the iPad screen to a Mac; screenshots and local OCR return to Muse Spark. Rejected steps return for revision.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#555d5e" stroke-width="1.5"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#638391" stroke-width="1.5"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#242b2d}.small{font-size:22px;fill:#626a6c}.label{font-size:24px;font-weight:700}.note{font-size:20px;fill:#647074}.line{fill:none;stroke:#555d5e;stroke-width:2.5;marker-end:url(#arrow)}.eye{fill:none;stroke:#638391;stroke-width:2.5;marker-end:url(#bluearrow)}.box{fill:#fffefa;stroke:#d4d7d1;stroke-width:2}</style></defs>
<rect width="1920" height="1080" fill="#f4f2ed"/>
<text x="85" y="90" font-size="22" letter-spacing="4" fill="#9a634c">ODE / SYSTEM ARCHITECTURE</text>
<text x="81" y="177" font-size="68" font-weight="700">Give Muse a body.</text>
<text x="85" y="226" font-size="27" fill="#626a6c">One model makes the plan. A tiny board gives it a way to act.</text>
<path class="line" d="M955 420V302H662V355" stroke-dasharray="7 7"/>
<text x="730" y="285" class="note">Revise if rejected</text>
<rect class="box" x="85" y="420" width="270" height="220" rx="23"/>
<path d="M126 466v24m9-35v46m9-30v14m9-24v34m9-29v25" stroke="#a56b52" stroke-width="5" stroke-linecap="round"/>
<text x="115" y="548" class="label">Voice</text><text x="115" y="585" class="small">Gemini Live</text>
<path class="line" d="M355 530H455"/>
<rect x="455" y="355" width="410" height="350" rx="27" fill="#e8d5c7" stroke="#ac7056" stroke-width="2.5"/>
<text x="493" y="409" font-size="19" font-weight="700" letter-spacing="3" fill="#885840">THE REASONING CENTER</text>
<text x="490" y="486" font-size="50" font-weight="700">Muse Spark</text>
<text x="493" y="538" font-size="27">Planner + actor</text>
<path d="M493 573H824" stroke="#c3a692" stroke-width="1.5"/>
<text x="493" y="616" font-size="24">Sees screen captures</text><text x="493" y="654" font-size="24">Chooses the next step</text>
<path class="line" d="M865 530H955"/>
<rect class="box" x="955" y="420" width="250" height="220" rx="23"/>
<path d="M988 470l11 11 23-27" fill="none" stroke="#628373" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="985" y="548" class="label">Jev judge</text><text x="985" y="585" class="small">Approves each step</text>
<path class="line" d="M1205 530H1295"/>
<text x="1250" y="506" text-anchor="middle" font-size="16" fill="#647074">Approved</text>
<rect class="box" x="1295" y="420" width="250" height="220" rx="23"/>
<rect x="1326" y="454" width="40" height="33" rx="4" fill="none" stroke="#738578" stroke-width="2.5"/><path d="M1334 447v7m9-7v7m9-7v7m-18 33v7m9-7v7m9-7v7" stroke="#738578" stroke-width="2.5"/>
<text x="1325" y="548" class="label">ESP32</text><text x="1325" y="585" class="small">BLE keyboard</text><text x="1325" y="615" class="small">+ mouse</text>
<path class="line" d="M1545 530H1635"/>
<rect class="box" x="1635" y="420" width="200" height="220" rx="23"/>
<rect x="1665" y="454" width="65" height="43" rx="6" fill="none" stroke="#555d5e" stroke-width="2.5"/>
<text x="1665" y="548" class="label">iPad mini</text><text x="1665" y="585" class="small">Apps on screen</text>
<path class="eye" d="M1735 640V860H1550"/>
<text x="1755" y="753" class="note">AirPlay</text><text x="1755" y="782" class="note">mirror</text>
<rect x="1170" y="785" width="380" height="150" rx="20" fill="#e8eef0" stroke="#b5c6cc" stroke-width="2"/>
<text x="1200" y="835" font-size="26" font-weight="700">Mac: the eyes</text><text x="1200" y="874" class="small">Receives the mirrored screen</text><text x="1200" y="908" class="small">Captures screenshots locally</text>
<path class="eye" d="M1170 860H1000"/>
<text x="1026" y="838" font-size="19" fill="#638391">Screenshots</text>
<rect x="720" y="795" width="280" height="140" rx="20" fill="#e8eef0" stroke="#b5c6cc" stroke-width="2"/>
<text x="750" y="850" font-size="26" font-weight="700">Local OCR</text><text x="750" y="891" class="small">Extracts screen text</text>
<path class="eye" d="M720 865H660V705"/>
<text x="472" y="803" font-size="20" fill="#638391">Screen + text</text><text x="472" y="831" font-size="20" fill="#638391">feedback</text>
<path d="M85 987H1835" stroke="#d6d8d2"/>
<text x="85" y="1033" class="note">No jailbreak. No Xcode. No app APIs.</text>
<text x="835" y="1033" class="note">Based on Henry Yuan’s “ESP32 iPhone Agent” (MIT).</text>
</svg>