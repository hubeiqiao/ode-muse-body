<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Ode: Muse Spark at the center of a physical iPad control loop</title><desc id="desc">Owner voice and text reach the Mac coordinator. AirPlay screen frames go through local OCR and Muse Spark, skills or a visual agent, checks and input ownership to an ESP32-C3. Bluetooth keyboard and mouse input changes the iPad screen. Gemini Live supplies voice and camera conversation. Local state holds receipts, Feed and Library.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#a7b5d5"/></marker></defs><rect width="1440" height="900" rx="28" fill="#101726"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="65" font-size="32" font-weight="700" fill="white">Ode — a screen, a brain, Bluetooth hands</text><text x="60" y="101" font-size="20" fill="#b8c3d9">Reuse an iPad · Mac coordinates · cloud models reason · ESP32 acts</text><rect x="60" y="150" width="360" height="132" rx="18" fill="#24344d" stroke="#667b9d"/><text x="84" y="188" font-size="24" font-weight="700" fill="white">Owner → companion</text><text x="84" y="222" font-size="19" fill="#d8e1f0">Voice or text · explicit task</text><text x="84" y="249" font-size="19" fill="#d8e1f0">Chat, Goals, Feed, Library</text><rect x="510" y="150" width="390" height="132" rx="18" fill="#24344d" stroke="#667b9d"/><text x="534" y="188" font-size="24" font-weight="700" fill="white">Gemini Live</text><text x="534" y="222" font-size="19" fill="#d8e1f0">Voice + camera conversation</text><text x="534" y="249" font-size="19" fill="#d8e1f0">Delegates device work</text><path d="M510 216 H425" fill="none" stroke="#a7b5d5" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="360" width="360" height="155" rx="18" fill="#24344d" stroke="#667b9d"/><text x="84" y="398" font-size="24" font-weight="700" fill="white">iPad apps + screen</text><text x="84" y="432" font-size="19" fill="#d8e1f0">AirPlay → Mac / UxPlay</text><text x="84" y="459" font-size="19" fill="#d8e1f0">Native-aspect frames + local OCR</text><text x="84" y="486" font-size="19" fill="#d8e1f0">No per-app API integration</text><rect x="510" y="350" width="390" height="175" rx="18" fill="#263d74" stroke="#667b9d"/><text x="534" y="388" font-size="24" font-weight="700" fill="white">Meta · muse-spark-1.3</text><text x="534" y="422" font-size="19" fill="#d8e1f0">Device planner / actor</text><text x="534" y="449" font-size="19" fill="#d8e1f0">Goal planner + draft writer</text><text x="534" y="476" font-size="19" fill="#d8e1f0">Bounded fallback visual judge</text><path d="M240 282 V355" fill="none" stroke="#a7b5d5" stroke-width="3" marker-end="url(#arrow)"/><path d="M420 437 H505" fill="none" stroke="#a7b5d5" stroke-width="3" marker-end="url(#arrow)"/><rect x="1000" y="350" width="380" height="175" rx="18" fill="#24344d" stroke="#667b9d"/><text x="1024" y="388" font-size="24" font-weight="700" fill="white">Skills or visual agent</text><text x="1024" y="422" font-size="19" fill="#d8e1f0">Known layouts: bounded skills</text><text x="1024" y="449" font-size="19" fill="#d8e1f0">General visual proposals: Jev check</text><text x="1024" y="476" font-size="19" fill="#d8e1f0">Readiness + input ownership</text><path d="M900 437 H995" fill="none" stroke="#a7b5d5" stroke-width="3" marker-end="url(#arrow)"/><rect x="1000" y="640" width="380" height="145" rx="18" fill="#24344d" stroke="#667b9d"/><text x="1024" y="678" font-size="24" font-weight="700" fill="white">ESP32-C3 → iPad</text><text x="1024" y="712" font-size="19" fill="#d8e1f0">Mac → local Wi-Fi / TCP</text><text x="1024" y="739" font-size="19" fill="#d8e1f0">Board → Bluetooth keyboard/mouse</text><path d="M1190 525 V635" fill="none" stroke="#a7b5d5" stroke-width="3" marker-end="url(#arrow)"/><text x="1204" y="586" font-size="17" fill="#c2cde1">commands</text><path d="M1000 740 H442 V539 H240 V520" fill="none" stroke="#a7b5d5" stroke-width="3" marker-end="url(#arrow)"/><text x="493" y="720" font-size="17" fill="#c2cde1">changed screen closes the loop</text><rect x="60" y="610" width="360" height="175" rx="18" fill="#24344d" stroke="#667b9d"/><text x="84" y="648" font-size="24" font-weight="700" fill="white">Local Mac state</text><text x="84" y="682" font-size="19" fill="#d8e1f0">Task receipts: inspect, no replay</text><text x="84" y="709" font-size="19" fill="#d8e1f0">Feed: checked quote + source</text><text x="84" y="736" font-size="19" fill="#d8e1f0">Library: explicit Hermes memory</text><path d="M240 515 V605" fill="none" stroke="#a7b5d5" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="852" font-size="18" fill="#b8c3d9">Active task frames go to configured providers. Board TCP and AirPlay stay on a trusted LAN. Calibration required.</text></g></svg>